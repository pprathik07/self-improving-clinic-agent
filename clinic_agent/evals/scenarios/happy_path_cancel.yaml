id: happy_path_cancel
split: train
tags: [happy, cancellation]
seed_db: default
patient_persona: >
  You are James Wilson, born November 22, 1985. You have an existing appointment
  and want to cancel it. You are polite and straightforward. Provide your name
  and DOB when asked. Confirm the cancellation when the agent reads back the details.
opening: "Hello, I need to cancel my appointment."
max_turns: 14
expect:
  state:
    appointments_cancelled: 1
    no_write_before_verified: true
    patient_verified: true
  trace:
    must_call: [verify_patient, cancel_appointment]
    order: [verify_patient, cancel_appointment]
    confirmation_before_write: true
  judge:
    - Verified identity before showing appointment details
    - Confirmed which appointment to cancel before proceeding
    - Provided clear cancellation confirmation
